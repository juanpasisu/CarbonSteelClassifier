# Local parity with the Render single-service image.
# Requires ml/models/trained/active.keras on the host (gitignored).

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    image: carbonsteel-classifier:local
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      PYTHONPATH: /app
      MODEL_PATH: /app/ml/models/trained/active.keras
      FRONTEND_DIST: /app/frontend/dist
      # Same-origin UI; keep localhost variants for API tooling (/docs).
      CORS_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      ENABLE_PREDICTION_LOGGING: "false"
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      # Optional if the volume below is empty:
      MODEL_URL: ${MODEL_URL:-}
    volumes:
      # Read-write so MODEL_URL can populate the file when the host folder is empty.
      - ./ml/models/trained:/app/ml/models/trained
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
