<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Identificación inteligente de microestructuras en aceros al carbono" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
    <title>MetalVision AI · CarbonSteelClassifier</title>
    <script>
      (() => {
        try {
          const theme = localStorage.getItem('metalvision.theme');
          const locale = localStorage.getItem('metalvision.locale');
          const resolved = theme === 'light' || theme === 'dark' ? theme : 'dark';
          document.documentElement.classList.toggle('dark', resolved === 'dark');
          document.documentElement.dataset.theme = resolved;
          document.documentElement.lang = locale === 'en' ? 'en' : 'es';
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
